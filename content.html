<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>content</title>
    <link rel="stylesheet" href="gabungan.css">
</head>
<body>
    
<!--MEMBUAT BAGIAN CONTENT DAN ISI CONTENT NYA-->
<main class="main-content">

    <div class="globe">
        <img
            src="https://images.unsplash.com/photo-1614730321146-b6fa6a46bcb4?auto=format&fit=crop&w=1200&q=90"
            alt="Planet Bumi"
        >
        <div class="location-point"></div>
    </div>

    <section class="radio-panel">
        <div class="station">
            <span class="station-number">1</span>
            <div class="station-info">
                <p>Horta</p>
                <small>Azores</small>
            </div>
            <small class="station-time">15:05</small>
        </div>

        <div class="radio-menu">
            <span>◉<small>Jelajahi</small></span>
            <span>♡<small>Favorit</small></span>
            <span>▤<small>Telusuri</small></span>
            <span>⌕<small>Cari</small></span>
            <span>☰<small>Setelan</small></span>
        </div>

        <div class="player">
            <div class="player-title">
                <div>
                    <strong>Rádio Azores High</strong>
                    <small>Horta, Azores</small>
                </div>
                <span>♡</span>
            </div>

            <div class="player-controls">
                <span>◀</span>
                <span class="pause">■</span>
                <span>▶</span>
                <div class="volume"></div>
                <span>•••</span>
            </div>
        </div>
    </section>

    <div class="map-controls">
        <button>♧</button>
        <button>➤</button>
        <button>▣</button>
        <button>+</button>
        <button>-</button>
    </div>

</main>

</body>
</html>
